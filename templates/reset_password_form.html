<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .form-container { max-width: 400px; width: 100%; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-container h2 { text-align: center; margin-bottom: 25px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Reset Your Password</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('reset_password_form') }}" id="resetPasswordForm">
            <input type="hidden" name="access_token" id="access_token">
            
            <div class="mb-3">
                <label for="new_password" class="form-label">New Password</label>
                <input type="password" class="form-control" id="new_password" name="new_password" required minlength="8">
            </div>
            <div class="mb-3">
                <label for="confirm_new_password" class="form-label">Confirm New Password</label>
                <input type="password" class="form-control" id="confirm_new_password" name="confirm_new_password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Reset Password</button>
        </form>
         <div class="text-center mt-3">
            <a href="{{ url_for('login') }}">Back to Login</a>
        </div>
    </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const hash = window.location.hash.substring(1); // Remove #
            const params = new URLSearchParams(hash);
            const accessToken = params.get('access_token');
            
            // Log the extracted token to the browser console for debugging
            console.log("Extracted access_token from URL hash:", accessToken);

            if (accessToken) {
                document.getElementById('access_token').value = accessToken;
                // Log that the hidden field is set
                console.log("Set hidden input 'access_token' value to:", document.getElementById('access_token').value);
            } else {
                console.warn('Access token not found in URL hash for password reset.');
                // Optionally, display a user-facing message here if the token is missing
                // For example:
                // const formContainer = document.querySelector('.form-container');
                // if (formContainer) {
                //     const errorDiv = document.createElement('div');
                //     errorDiv.className = 'alert alert-danger';
                //     errorDiv.textContent = 'Invalid password reset link: No token found. Please request a new link.';
                //     formContainer.insertBefore(errorDiv, formContainer.firstChild);
                //     document.getElementById('resetPasswordForm').style.display = 'none'; // Hide the form
                // }
            }
        });
    </script>
</body>
</html>
