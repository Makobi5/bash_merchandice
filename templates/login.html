<!-- File: templates/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .form-container { max-width: 450px; margin: 50px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-container h2 { text-align: center; margin-bottom: 25px; }
        #register-form { display: block; } 
        #login-form { display: block; } 
        .form-separator { text-align: center; margin: 20px 0; color: #6c757d; }
        
        /* Styling for the forgot password link */
        .forgot-password-link-container { 
            text-align: right; 
            margin-top: 0.5rem; /* Add some space above the link */
            margin-bottom: 1rem; /* Add some space below the link, before "OR" */
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div style="max-width: 450px; margin: 15px auto -15px auto;">
              {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                  {{ message }}
                  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <div class="form-container">
            <!-- Login Form -->
            <div id="login-form">
                <h2>Login</h2>
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="loginEmail" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="loginEmail" name="email" required value="{{ request.form.email if request.form.email }}">
                    </div>
                    <div class="mb-3">
                        <label for="loginPassword" class="form-label">Password</label>
                        <input type="password" class="form-control" id="loginPassword" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <!-- **** CORRECTED FORGOT PASSWORD LINK SECTION **** -->
                <div class="forgot-password-link-container"> 
                    {# This is a Jinja comment and won't be rendered #}
                    <a href="{{ url_for('request_password_reset') }}">Forgot Password?</a>
                </div>
                <!-- **** END OF FORGOT PASSWORD LINK SECTION **** -->
            </div>

            <div class="form-separator">OR</div>

            <!-- Registration Form -->
            <div id="register-form">
                <h2>Register</h2>
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label for="regFirstName" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="regFirstName" name="first_name" value="{{ reg_first_name | default('') }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="regLastName" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="regLastName" name="last_name" value="{{ reg_last_name | default('') }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="regEmail" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="regEmail" name="email" value="{{ reg_email | default('') }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="regPassword" class="form-label">Password (min 8 characters)</label>
                        <input type="password" class="form-control" id="regPassword" name="password" required minlength="8">
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" name="confirm_password" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Register</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
